# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: ocrmypdf
  version: "17.14.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ocrmypdf-${{ version }}.tar.gz
  sha256: 77412e62f621f1d1dbf4a333b4ef76c7f70977b1cb2d1d1f2d8d1e85939c0bf7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - ocrmypdf = ocrmypdf.__main__:run

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }},<4
    - fpdf2 >=2.9.0
    - img2pdf >=0.6
    - packaging >=20
    - pdfminer-six >=20260107
    # conda-forge pikepdf ships the [pdfa] extra dependencies
    - pikepdf >=10.18
    - pillow >=13
    - pluggy >=1
    - pydantic >=2.14
    - pypdfium2 >=5.15.0
    - rich >=13
    - typing_extensions >=4.12
    - uharfbuzz >=0.53.2
    # external programs
    - pngquant
    - tesseract
  run_constraints:
    # optional [heic] extra; opt-in upstream because wheels bundle GPLv2 x265
    - pillow-heif >=1.7.0

tests:
  - python:
      imports:
        - ocrmypdf
        - ocrmypdf._exec
      # conda-forge pdfminer-six reports version 0.0.0 in its dist metadata
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - tests/resources/linn.pdf
        - tests/resources/graph_ocred.pdf
    script:
      - ocrmypdf --help
      - ocrmypdf --version
      - ocrmypdf --mode force --output-type pdf tests/resources/linn.pdf ocr_output.pdf
      - test -s ocr_output.pdf
      - ocrmypdf --mode force --output-type pdfa --pdfa-backend internal tests/resources/linn.pdf ocr_pdfa.pdf
      - test -s ocr_pdfa.pdf
      - ocrmypdf --mode skip --optimize 3 --output-type pdf tests/resources/graph_ocred.pdf opt_output.pdf
      - test -s opt_output.pdf

about:
  summary: OCRmyPDF adds an OCR text layer to scanned PDF files, allowing them to be searched
  license: MPL-2.0
  license_file: LICENSE
  homepage: https://github.com/ocrmypdf/OCRmyPDF
  repository: https://github.com/ocrmypdf/OCRmyPDF
  documentation: https://ocrmypdf.readthedocs.io/

extra:
  recipe-maintainers:
    - izahn
    - carlodri
    - rxm7706
